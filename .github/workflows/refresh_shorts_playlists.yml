name: Refresh YouTube Shorts Playlists

on:
  schedule:
    # Run daily at 06:00 UTC (adjust as needed)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  curate-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Curator (Unattended)
        env:
          # Paste the contents of your token.json into GitHub Repository Secrets as YOUTUBE_TOKEN_JSON
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python curator.py --config config.yaml

      - name: Commit & Push Updated State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json
          git diff-index --quiet HEAD || git commit -m "Auto-update YouTube Shorts curator state [skip ci]"
          git push
