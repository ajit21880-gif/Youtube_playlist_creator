# ==============================================================================
# YouTube Shorts Playlist Curator - Configuration
# ==============================================================================
# This configuration controls authentication paths, shorts detection rules,
# scoring algorithms, playlist definitions, and daily quota limits.
# ==============================================================================

# --- Authentication & Storage ---
auth:
  # Path to OAuth 2.0 client secret downloaded from Google Cloud Console
  client_secrets_file: "client_secret.json"
  # Path to saved refresh token (created on first interactive run, reused unattended)
  token_file: "token.json"
  # State file to track managed playlist IDs and short-detection cache
  state_file: "state.json"

# --- Shorts Detection Rules ---
shorts_detection:
  # Maximum duration in seconds for YouTube Shorts (official standard is 60s)
  max_duration_seconds: 60
  # Perform an HTTP HEAD check on https://www.youtube.com/shorts/{id}
  # (Returns HTTP 200 for Shorts, HTTP 303 redirect for horizontal videos)
  verify_via_head_request: true
  # Cache short detection in state_file to eliminate repeated HEAD requests on future runs
  cache_short_status: true
  # Exclude shorts with fewer views than this threshold to reduce 1-view noise
  min_views_threshold: 10

# --- Transparent Scoring Formula ---
# Formula:
#   Score = (Likes ^ 1.0) * (1 + EngagementBonus) * RecencyMultiplier
#
# Where:
#   LikeToViewRatio = min(likes / max(views, 1), max_like_ratio_cap)
#   CommentToViewRatio = min(comments / max(views, 1), max_comment_ratio_cap)
#   EngagementBonus = (LikeToViewRatio * like_ratio_weight) + (CommentToViewRatio * comment_ratio_weight)
#   RecencyMultiplier = (1.0 - recency_floor) * (2 ^ (-age_days / half_life_days)) + recency_floor
scoring:
  # Primary driver weight (1.0 means linear likes)
  likes_weight: 1.0
  # Weight multiplier for Like-to-View engagement ratio
  like_ratio_weight: 3.5
  # Upper cap for Like-to-View ratio to prevent skewed scores on low-view videos
  max_like_ratio_cap: 0.35
  # Weight multiplier for Comment-to-View engagement ratio
  comment_ratio_weight: 5.0
  # Upper cap for Comment-to-View ratio
  max_comment_ratio_cap: 0.10
  # Recency exponential half-life in days (younger videos receive a boost)
  half_life_days: 45.0
  # Minimum recency multiplier floor so evergreen viral hits never fade to zero (0.0 to 1.0)
  recency_floor: 0.40

# --- Quota Management ---
quota:
  # Daily YouTube API quota budget limit (Default API daily quota is 10,000 units)
  # Writes (insert/delete playlist items) cost 50 units each.
  max_daily_budget_units: 8000
  # Safety stop: Halt run if remaining budget in current execution falls below this number
  reserve_buffer_units: 200

# --- Managed Playlists Definitions ---
# Each playlist will be created if not present or refreshed idempotently via diffing.
playlists:
  - id_key: "top_shorts"
    title: "🔥 Top Shorts: Channel Best"
    description: "The most popular, highest-rated Shorts on the channel. Ranked by likes and viewer engagement. Refreshed automatically."
    privacy: "public" # public, unlisted, or private
    strategy: "top_overall" # top_overall, rank_slice, high_engagement, most_recent
    max_items: 15
    slice_start: 0
    slice_end: 15

  - id_key: "rising_shorts"
    title: "⚡ Rising & Fan-Favorite Shorts"
    description: "Trending and high-performing Shorts you cannot miss. Updated regularly."
    privacy: "public"
    strategy: "rank_slice"
    max_items: 15
    slice_start: 15
    slice_end: 30

  - id_key: "hidden_gems"
    title: "💎 Hidden Gems | Highest Viewer Love"
    description: "Shorts with the highest like-to-view ratios and conversation rates. The real community favorites!"
    privacy: "public"
    strategy: "high_engagement"
    max_items: 15
    slice_start: 0
    slice_end: 15
